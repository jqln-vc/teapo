  </defs>
  <path d="M120 16 C110 16 104 26 104 36 C104 46 112 52 120 52 C128 52 136 46 136 36 C136 26 130 16 120 16 Z" fill="#B33427"/>
  <path class="ink" d="M62 108 Q62 100 74 100 Q92 74 120 66 Q148 74 166 100 Q178 100 178 108" stroke-width="10" fill="none"/>
  <g clip-path="url(#bowl)">
    <rect x="55" y="138" width="130" height="22" fill="#2E7A2A"/>
    <rect x="55" y="160" width="130" height="16" fill="#7EB84B"/>
    <rect x="55" y="176" width="130" height="34" fill="#D9A73B"/>
  </g>
  <path class="ink" d="M28 132 Q40 122 52 126 Q60 132 62 140 Q66 190 120 206 Q174 190 178 140 Q180 132 188 126 Q200 122 212 132" stroke-width="10" fill="none"/>
  <path d="M34 214 Q34 228 120 228 Q206 228 206 214" stroke="#B33427" stroke-width="10" fill="none"/>
