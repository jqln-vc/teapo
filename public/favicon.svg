<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 16 212 212" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The teapo mark, from the design system's assets/logo.svg.
       viewBox is cropped to the artwork's bounding box so the mark fills a 16px
       tab icon instead of floating in the original 240x240 padding.
       The brown lightens in dark mode, or the strokes vanish against a dark tab strip. -->
